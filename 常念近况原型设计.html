<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>常念 · 近况页 · Health Style</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                 "PingFang SC", "Helvetica Neue", sans-serif;
    background: #ECECF0;
    min-height: 100vh;
    display: flex; justify-content: center; align-items: center;
    padding: 40px 20px;
  }

  .phone {
    width: 390px; height: 844px; background: #ECECF0;
    border-radius: 55px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.25),
                0 0 0 11px #1d1d1f, 0 0 0 12px #2c2c2e;
    overflow: hidden; position: relative; display: flex; flex-direction: column;
    isolation: isolate;
  }

  .dynamic-island {
    position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 34px; background: #000; border-radius: 20px; z-index: 100;
  }

  .status-bar {
    height: 54px; display: flex; justify-content: space-between; align-items: center;
    padding: 16px 32px 0; font-size: 16px; font-weight: 600; color: #1C1C1E;
    flex-shrink: 0; letter-spacing: -0.2px;
  }
  .status-bar .icons { display: flex; gap: 6px; align-items: center; }

  .nav-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 20px 6px; flex-shrink: 0;
  }
  .family-switcher {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px 8px 4px; border-radius: 12px;
  }
  .family-switcher .name {
    font-size: 20px; font-weight: 600; color: #1C1C1E; letter-spacing: -0.4px;
  }
  .family-switcher .chevron {
    width: 14px; height: 14px; color: #8E8E93; margin-top: 2px;
  }

  .nav-right { display: flex; align-items: center; gap: 10px; }

  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: #FA114F;
    display: flex; align-items: center; justify-content: center;
    color: #FFFFFF; font-size: 14px; font-weight: 600;
    box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 3px rgba(250, 17, 79, 0.15);
  }

  .content {
    flex: 1;
    overflow: hidden;
    padding: 12px 16px 16px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    gap: 18px;
  }

  .card {
    background: #FFFFFF; border-radius: 18px;
    padding: 20px 22px;
    flex: 1.618;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .card-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 14px;
    flex-shrink: 0;
  }
  .card-title {
    font-size: 22px; font-weight: 700; color: #1C1C1E; letter-spacing: -0.5px;
  }
  .card-meta { font-size: 13px; color: #8E8E93; font-weight: 500; }
  .card-body {
    font-size: 15px; line-height: 1.75; color: #1C1C1E; letter-spacing: -0.1px;
    flex: 1;
    overflow: hidden;
  }

  .recent-block {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .section-header {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 0 4px 10px;
    flex-shrink: 0;
  }
  .section-header .title {
    font-size: 14px; font-weight: 700; color: #1C1C1E; letter-spacing: -0.2px;
  }
  .section-header .more {
    font-size: 14px; font-weight: 700; color: #1C1C1E; letter-spacing: -0.2px;
  }

  .timeline-card {
    background: #FFFFFF; border-radius: 16px; overflow: hidden;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .timeline-row {
    display: flex; padding: 12px 18px; gap: 14px;
    align-items: flex-start; position: relative;
    flex: 1;
    min-height: 0;
  }
  .timeline-row + .timeline-row::before {
    content: ""; position: absolute; left: 62px; right: 0; top: 0;
    height: 0.5px; background: #E5E5EA;
  }
  .timeline-day { width: 44px; flex-shrink: 0; padding-top: 2px; }
  .timeline-day .d1 { font-size: 13px; font-weight: 600; color: #1C1C1E; }
  .timeline-day .d2 { font-size: 11px; color: #8E8E93; margin-top: 1px; }
  .timeline-row.today .timeline-day .d1 { color: #30D158; }
  .timeline-text {
    flex: 1; font-size: 14px; line-height: 1.5;
    color: #3C3C43; letter-spacing: -0.1px;
  }

  .tab-bar {
    height: 83px;
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: saturate(180%) blur(30px);
    -webkit-backdrop-filter: saturate(180%) blur(30px);
    border-top: 0.5px solid #E5E5EA;
    display: flex; flex-shrink: 0; padding-bottom: 28px;
    border-bottom-left-radius: 55px;
    border-bottom-right-radius: 55px;
  }
  .tab {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 3px; font-size: 10px; color: #8E8E93; font-weight: 500;
  }
  .tab.active.near { color: #30D158; }
  .tab .icon {
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
  }
  .tab .icon svg { width: 26px; height: 26px; }

  .home-indicator {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 134px; height: 5px; background: #000; border-radius: 3px;
  }
</style>
</head>
<body>

<div class="phone">

  <div class="dynamic-island"></div>

  <div class="status-bar">
    <span>9:41</span>
    <div class="icons">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><path d="M1 8h2v2H1zM5 6h2v4H5zM9 4h2v6H9zM13 1h2v9h-2z"/></svg>
      <svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor"><path d="M8 2.5a8 8 0 015.3 2l1.4-1.5a10 10 0 00-13.4 0l1.4 1.5A8 8 0 018 2.5zm0 3a5 5 0 013.3 1.3l1.4-1.4a7 7 0 00-9.4 0L4.7 6.8A5 5 0 018 5.5zm0 3a2 2 0 011.4.6l1.4-1.4a4 4 0 00-5.6 0L6.6 9A2 2 0 018 8.5z"/></svg>
      <svg width="25" height="11" viewBox="0 0 25 11" fill="none"><rect x="0.5" y="0.5" width="21" height="10" rx="2.5" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="18" height="7" rx="1.5" fill="currentColor"/><path d="M23 4v3" stroke="currentColor" stroke-width="1.5" opacity="0.4"/></svg>
    </div>
  </div>

  <div class="nav-bar">
    <div class="family-switcher">
      <span class="name">妈妈</span>
      <svg class="chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 6l4 4 4-4"/>
      </svg>
    </div>
    <div class="nav-right">
      <div class="avatar">晓</div>
    </div>
  </div>

  <div class="content">

    <div class="card">
      <div class="card-head">
        <div class="card-title">周报</div>
        <div class="card-meta">11.18 — 11.24</div>
      </div>
      <div class="card-body">
        这周爸爸去了三次公园，都是傍晚。周三那次碰上了李叔叔，两人在石桌上下了一盘棋，爸爸赢了，回家路上还买了两个橘子。妈妈做了你小时候爱吃的糖醋排骨，中午做好之后拍了张照片。天气转凉，爸爸这周提过两次腰酸，都说不碍事。
      </div>
    </div>

    <div class="recent-block">
      <div class="section-header">
        <div class="title">最近三天</div>
        <div class="more">查看七天</div>
      </div>

      <div class="timeline-card">
        <div class="timeline-row today">
          <div class="timeline-day"><div class="d1">今天</div><div class="d2">周日</div></div>
          <div class="timeline-text">爸爸傍晚去了公园，和李叔叔下了棋。回家买了两个橘子。</div>
        </div>
        <div class="timeline-row">
          <div class="timeline-day"><div class="d1">昨天</div><div class="d2">周六</div></div>
          <div class="timeline-text">妈妈一早去菜市场，买了排骨和青菜。中午给你发了做好的照片。</div>
        </div>
        <div class="timeline-row">
          <div class="timeline-day"><div class="d1">前天</div><div class="d2">周五</div></div>
          <div class="timeline-text">爸爸提了一次腰有点酸，没当回事，下午照常出门散步。</div>
        </div>
      </div>
    </div>

  </div>

  <div class="tab-bar">
    <div class="tab active near">
      <div class="icon"><svg viewBox="0 0 28 28" fill="currentColor"><path d="M14 3.5L3 12.5V24a1.5 1.5 0 001.5 1.5h6v-8h7v8h6A1.5 1.5 0 0024 24V12.5L14 3.5z"/></svg></div>
      <span>近况</span>
    </div>
    <div class="tab">
      <div class="icon"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10c0-2.2 1.8-4 4-4h8c2.2 0 4 1.8 4 4v5c0 2.2-1.8 4-4 4h-5l-5 4v-4c-1.2 0-2-.8-2-2v-7z"/></svg></div>
      <span>话题</span>
    </div>
    <div class="tab">
      <div class="icon"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13L14 4l10 9v10a1.5 1.5 0 01-1.5 1.5h-17A1.5 1.5 0 014 23V13z"/><path d="M10 24v-6h8v6"/></svg></div>
      <span>家</span>
    </div>
  </div>

  <div class="home-indicator"></div>

</div>

</body>
</html>
