plugins {
    id "com.android.application"
}

android {
    namespace "com.changnian.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.changnian.app"
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName "1.0.1"
    }

    signingConfigs {
        release {
            storeFile file("../keystore/changnian-release.jks")
            storePassword "changnian2026"
            keyAlias "changnian"
            keyPassword "changnian2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}
