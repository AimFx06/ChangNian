server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: changan-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:changnian}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 80MB
  sql:
    init:
      mode: always
      encoding: UTF-8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

app:
  jwt-secret: ${APP_JWT_SECRET:change-this-dev-secret-please-change}
  token-ttl-hours: ${APP_TOKEN_TTL_HOURS:168}
  upload-dir: ${APP_UPLOAD_DIR:uploads}
  demo:
    seed-history: ${APP_DEMO_SEED_HISTORY:false}
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
